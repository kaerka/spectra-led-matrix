---
- name: Reload NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded

- name: Reload udev
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: true

- name: Trigger udev for connected USB devices
  ansible.builtin.command: udevadm trigger --subsystem-match=usb
  changed_when: true

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Restart spectra-wifi-powersave-off
  ansible.builtin.systemd:
    name: spectra-wifi-powersave-off
    state: restarted
    daemon_reload: true

- name: Restart spectra-wlan0-down
  ansible.builtin.systemd:
    name: spectra-wlan0-down
    state: restarted
    daemon_reload: true
