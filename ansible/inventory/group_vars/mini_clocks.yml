# Mini-Spectra Clocks: standalone Pi4 + Adafruit HAT + 1-4 64x64 panels.
# No Pi5: code is pushed from the Ansible machine, MQTT broker runs locally,
# and the wall web UI on :8080 is the device's own control page.

is_matrix_pi: true
is_mini_clock: true

matrix_controller_sync_source: local
mqtt_broker_host: localhost
mosquitto_listen_address: "0.0.0.0"
mosquitto_port: 1883

# Written to /data/spectra/config/matrix.local.json (see display/matrix_config.py).
# Add panels by raising chain_length; a 2x2 block uses pixel_mapper "U-mapper".
matrix_config:
  panel_rows: 64
  panel_cols: 64
  chain_length: 1
  parallel: 1
  hardware_mapping: adafruit-hat
  pixel_mapper: ""
  gpio_slowdown: 4
  max_brightness: 90

# Fixed brightness behind a thick diffuser: schedule off => max_brightness all day.
brightness_schedule:
  enabled: false
  timezone: America/New_York
  check_interval_seconds: 30
  steps:
    - { time: "07:00", brightness: 90 }

display_state_active_mode: world_clock

legacy_services_to_disable:
  - worldclock.service
  - spectra-clock.service
  - mqtt-display.service
