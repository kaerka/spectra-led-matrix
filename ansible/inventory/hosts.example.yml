# Copy to hosts.yml (gitignored) and fill in your addresses.
#
#   cp inventory/hosts.example.yml inventory/hosts.yml
#
# Example topology (placeholders only — use your own hostnames/IPs):
#   controller  — Raspberry Pi 5 (Ansible, Mosquitto, orchestrator)
#   wall-upper / wall-lower — Raspberry Pi 4 matrix hosts
#   Prefer a dedicated ethernet link between controller and walls.
#
all:
  vars:
    mqtt_broker_host: controller.local
  children:
    controller:
      hosts:
        spectra-controller:
          ansible_host: 127.0.0.1
          ansible_connection: local
          ansible_user: spectra
    # Optional: remote Whisper inference host (e.g. Radxa Q6A).
    # whisper_offload:
    #   hosts:
    #     spectra-offload:
    #       ansible_host: offload.local
    #       ansible_user: spectra
    matrix_pis:
      hosts:
        wall-upper:
          ansible_host: wall-upper.local
          ansible_user: spectra
          # mqtt_wall_sources: [meshtastic, whisper]
        wall-lower:
          ansible_host: wall-lower.local
          ansible_user: spectra
    # Standalone Mini-Spectra Clocks (playbooks/mini-clocks.yml).
